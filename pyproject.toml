[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eac-dso-portal"
version = "0.1.0"
description = "Async Python client for the EAC (Electricity Authority of Cyprus) Distribution Web Portal"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "santafox" }]
keywords = ["eac", "cyprus", "electricity", "smart-meter", "home-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = [
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "aioresponses>=0.7",
    "python-dotenv>=1",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/santafox/eac-dso-portal"
Issues = "https://github.com/santafox/eac-dso-portal/issues"
"Home Assistant integration" = "https://github.com/santafox/ha-eac"

[tool.hatch.build.targets.wheel]
packages = ["src/eac_dso_portal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
