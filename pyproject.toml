[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eac-dso-portal"
version = "0.1.0"
description = "Async Python client for the EAC (Electricity Authority of Cyprus) Distribution Web Portal"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "santafox" }]
keywords = ["eac", "cyprus", "electricity", "smart-meter", "home-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = [
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "aioresponses>=0.7",
    "python-dotenv>=1",
    "ruff",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/santafox/eac-dso-portal"
Issues = "https://github.com/santafox/eac-dso-portal/issues"
"Home Assistant integration" = "https://github.com/santafox/ha-eac"

[tool.hatch.build.targets.wheel]
packages = ["src/eac_dso_portal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "smoke: end-to-end test against the real EAC portal (requires .env credentials)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "PLE",  # pylint errors
]
ignore = [
    "E501",  # line too long (formatter handles)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # asserts in tests are fine

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["aioresponses", "aioresponses.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests use fixtures and dynamic dispatch; partial typing is fine.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
